<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ZeroToken Provider Console</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <aside class="sidebar">
        <div class="brand">
          <span class="mark"></span>
          <div>
            <h1>ZeroToken</h1>
            <p>Provider Console</p>
          </div>
        </div>
        <section>
          <h2>Providers</h2>
          <div id="providerList" class="provider-list"></div>
        </section>
      </aside>

      <section class="workspace">
        <header class="toolbar">
          <div>
            <h2>Generate</h2>
            <p id="statusText">Loading providers...</p>
          </div>
          <button id="refreshBtn" type="button">Refresh</button>
        </header>

        <form id="generateForm" class="panel">
          <div class="grid two">
            <label>
              Provider
              <select id="providerSelect"></select>
            </label>
            <label>
              Model
              <select id="modelSelect"></select>
            </label>
          </div>

          <div class="grid three">
            <label>
              Capability
              <select id="capabilitySelect">
                <option value="storyboard_generation">storyboard_generation</option>
                <option value="text_generation">text_generation</option>
                <option value="image_generation">image_generation</option>
              </select>
            </label>
            <label>
              Aspect ratio
              <select id="aspectRatioSelect">
                <option>16:9</option>
                <option>9:16</option>
                <option>1:1</option>
                <option>4:3</option>
                <option>3:4</option>
              </select>
            </label>
            <label>
              Resolution
              <select id="resolutionSelect">
                <option>2K</option>
                <option>1K</option>
                <option>4K</option>
              </select>
            </label>
          </div>

          <label>
            Prompt
            <textarea id="promptInput" rows="9">children storybook illustration, a fluffy white cloud character floating in a dreamy starry night sky, warm smile, soft pastel colors, clean composition</textarea>
          </label>

          <div class="actions">
            <button id="runBtn" type="submit">Run</button>
            <span class="hint">Requires Debug Chrome for real Web providers.</span>
          </div>
        </form>

        <section class="result-layout">
          <div class="panel">
            <h3>Result</h3>
            <pre id="resultBox">{}</pre>
          </div>
          <div class="panel">
            <h3>Images</h3>
            <div id="imageGrid" class="image-grid"></div>
          </div>
        </section>
      </section>
    </main>
    <script src="/app.js" type="module"></script>
  </body>
</html>
